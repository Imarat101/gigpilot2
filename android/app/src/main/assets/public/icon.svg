<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="#10b981" stroke-width="6" opacity="0.4" />

  <!-- Radar / Scanner Rings -->
  <circle cx="256" cy="240" r="150" fill="none" stroke="#34d399" stroke-width="3" opacity="0.2" />
  <circle cx="256" cy="240" r="95" fill="none" stroke="#34d399" stroke-width="4" opacity="0.35" />

  <!-- Speed Needle / Wing / HUD Shield -->
  <path d="M256 90 L380 170 L340 330 L256 410 L172 330 L132 170 Z" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linejoin="round" />

  <!-- GP Letters / Bolt -->
  <path d="M225 180 L295 180 L255 250 L300 250 L220 350 L240 270 L195 270 Z" fill="url(#glow)" />

  <!-- Pulse Dot -->
  <circle cx="380" cy="170" r="16" fill="#34d399" />
  <circle cx="380" cy="170" r="8" fill="#ffffff" />
</svg>
